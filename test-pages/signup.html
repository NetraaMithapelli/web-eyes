<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Create your account</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<header>ShopEasy</header>
<main>
  <h1>Create your account</h1>
  <p class="hint">Welcome back, Priya Sharma. We will text +91 98765 43210 to verify your number.</p>
  <form id="signup" onsubmit="event.preventDefault(); document.getElementById('done').hidden = false;">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" value="Priya Sharma" autocomplete="name" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="priya.sharma@gmail.com" autocomplete="email" required>
    <label for="phone">Mobile number</label>
    <input id="phone" name="phone" type="tel" value="+91 98765 43210" autocomplete="tel" required>
    <label for="dob">Date of birth</label>
    <input id="dob" name="dob" type="date" value="1998-04-17" autocomplete="bday">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" value="Hunter2!secret" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p id="done" hidden style="color:#2e7d32;font-weight:600">Account created (mock). No data was sent anywhere.</p>
</main>
</body></html>
